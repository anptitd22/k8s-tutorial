{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.secretName" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secret.keys.rootUsername | default "mongo-root-username" }}: {{ .Values.secret.data.rootUsername | b64enc | quote }}
  {{ .Values.secret.keys.rootPassword | default "mongo-root-password" }}: {{ .Values.secret.data.rootPassword | b64enc | quote }}
{{- end }}
