apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "chart.mongoExpress.fullname" . }}-test-connection"
  labels:
    {{- include "chart.mongoExpress.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: test-connection
      image: busybox:latest
      command: ['nc', '-z', '-w', '3', '{{ include "chart.mongoExpress.serviceName" . }}', '{{ .Values.mongoExpress.service.port }}']
  restartPolicy: Never
