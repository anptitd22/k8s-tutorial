{{- if .Values.mongoExpress.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.mongoExpress.fullname" . }}
  labels:
    {{- include "chart.mongoExpress.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mongoExpress.replicaCount }}
  selector:
    matchLabels:
      {{- include "chart.mongoExpress.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.mongoExpress.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.mongoExpress.labels" . | nindent 8 }}
        {{- with .Values.mongoExpress.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.mongoExpress.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongoExpress.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.mongoExpress.name | default "mongo-express" }}
          image: "{{ .Values.mongoExpress.image.repository }}:{{ .Values.mongoExpress.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.mongoExpress.image.pullPolicy }}
          {{- with .Values.mongoExpress.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mongoExpress.service.port | default 8081 }}
              protocol: TCP
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.secretName" . }}
                  key: {{ .Values.secret.keys.rootUsername | default "mongo-root-username" }}
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.secretName" . }}
                  key: {{ .Values.secret.keys.rootPassword | default "mongo-root-password" }}
            - name: ME_CONFIG_MONGODB_SERVER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "chart.configMapName" . }}
                  key: database_url
          {{- with .Values.mongoExpress.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mongoExpress.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.mongoExpress.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongoExpress.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongoExpress.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongoExpress.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
