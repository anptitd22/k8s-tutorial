{{- if and .Values.mongoExpress.enabled .Values.mongoExpress.tlsSecret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-tls" (include "chart.mongoExpress.fullname" .)) .Values.mongoExpress.tlsSecret.name }}
  {{- if .Values.mongoExpress.tlsSecret.namespace }}
  namespace: {{ .Values.mongoExpress.tlsSecret.namespace }}
  {{- end }}
  labels:
    {{- include "chart.mongoExpress.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.mongoExpress.tlsSecret.cert | b64enc | quote }}
  tls.key: {{ .Values.mongoExpress.tlsSecret.key | b64enc | quote }}
{{- end }}
