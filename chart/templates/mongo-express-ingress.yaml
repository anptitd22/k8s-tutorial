{{- if and .Values.mongoExpress.enabled .Values.mongoExpress.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ default (printf "%s-ingress" (include "chart.mongoExpress.fullname" .)) .Values.mongoExpress.ingress.name }}
  labels:
    {{- include "chart.mongoExpress.labels" . | nindent 4 }}
  {{- with .Values.mongoExpress.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.mongoExpress.ingress.className }}
  ingressClassName: {{ .Values.mongoExpress.ingress.className }}
  {{- end }}
  {{- if .Values.mongoExpress.ingress.tls }}
  tls:
    {{- range .Values.mongoExpress.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.mongoExpress.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "chart.mongoExpress.serviceName" $ }}
                port:
                  number: {{ $.Values.mongoExpress.service.port | default 8081 }}
          {{- end }}
    {{- end }}
{{- end }}
