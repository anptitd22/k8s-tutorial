apiVersion: v1
kind: Secret
metadata:
  name: repo-k8s-tutorial
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/anptitd22/k8s-tutorial.git
  # Điền GitHub username của bạn
  username: anptitd22
  # Điền GitHub Personal Access Token (classic token với quyền 'repo', hoặc fine-grained token với quyền read repo contents)
  password: YOUR_GITHUB_PERSONAL_ACCESS_TOKEN
